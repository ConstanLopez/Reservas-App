services:
  db:
    image: mysql:5.7
    container_name: reservasapp-db
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: reservas_db
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppass
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db:/docker-entrypoint-initdb.d   # corre 01_, 02_, 03_... la PRIMERA vez

  backend:
    build: ./backend
    container_name: reservasapp-back
    env_file:
      - ./backend/.env                      # variables del backend (dentro del contenedor)
    environment:
      DB_HOST: localhost                           # dentro de la red docker → host = db, port = 3306
      DB_PORT: 3307
    ports:
      - "5000:5000"
    command: python -m app.main
    depends_on:
      - db

volumes:
  mysql_data:
